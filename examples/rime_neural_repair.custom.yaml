# Opt-in pre-commit full-dictionary neural span repair & literal-lock processor for rime-neural (>= v2.0.0)
# Merge these keys into your schema's `*.custom.yaml` (e.g. `rime_frost_double_pinyin.custom.yaml`).
# Requires `lua/rime_neural_repair.lua` in your Rime user `lua/` directory.
patch:
  translator/max_sentences: 8   # Expose sentence candidates (already set when using rime_neural)
  "engine/processors/@before 0": lua_processor@*rime_neural_repair
  rime_neural_repair:
    repair_key: "Alt+r"         # Pre-commit full-dictionary + 1-edit typo + neural-ranked span repair (Left/Right, 1-9/Space, Escape); set "" to disable
    lock_key: "Alt+l"           # Pre-commit verbatim ASCII literal lock (GPUv2, OAuth2, v2.0.0); set "" to disable
