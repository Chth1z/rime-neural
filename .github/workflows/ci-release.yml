name: CI & Windows x64 Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release DLL (win-x64)
        run: cargo build --release --locked

      - name: Package release bundle & SHA-256
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rime_neural.dll dist/rime_neural.dll
          Copy-Item lua/rime_neural.lua dist/rime_neural.lua
          Copy-Item LICENSE dist/LICENSE
          $hDll = (Get-FileHash dist/rime_neural.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $hLua = (Get-FileHash dist/rime_neural.lua -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$hDll  rime_neural.dll"
            "$hLua  rime_neural.lua"
          ) | Set-Content -Path dist/SHA256SUMS.txt -Encoding ASCII
          $zipName = "rime-neural-$tag-win-x64.zip"
          Compress-Archive -Path dist/rime_neural.dll, dist/rime_neural.lua, dist/LICENSE, dist/SHA256SUMS.txt -DestinationPath "dist/$zipName" -Force
          $hZip = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hZip  $zipName" | Add-Content -Path dist/SHA256SUMS.txt -Encoding ASCII
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rime-neural-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/${{ env.ZIP_NAME }}" "dist/SHA256SUMS.txt" --title "rime-neural ${{ github.ref_name }}" --generate-notes
