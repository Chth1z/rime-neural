name: CI & Windows x64 Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Validate tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $cargo = Get-Content Cargo.toml -Raw -Encoding UTF8
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Failed to parse version in Cargo.toml" }
          $expectedTag = "v$($Matches[1])"
          if ($env:TAG -ne $expectedTag) {
            throw "Git tag '$($env:TAG)' does not match Cargo.toml version '$expectedTag'"
          }

      - name: Validate PowerShell scripts, Python tuner & YAML examples
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 1. PowerShell AST syntax + UTF-8 no-BOM pure-ASCII validation across all scripts
          foreach ($ps in @("scripts/install.ps1", "skills/rime-neural-setup/scripts/inspect-env.ps1", "skills/rime-neural-setup/scripts/verify-install.ps1")) {
            $full = (Resolve-Path $ps).Path
            $bytes = [System.IO.File]::ReadAllBytes($full)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "UTF-8 BOM detected in ${ps}"
            }
            if ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1) {
              throw "Non-ASCII byte detected in ${ps}"
            }
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              throw "PowerShell syntax error in ${ps}: $($errs | Out-String)"
            }
          }
          # 2. Ensure Python test deps (numpy, pyyaml) & run tuner edge-case self-test
          python -c "import numpy, yaml" 2>$null
          if ($LASTEXITCODE -ne 0) {
            python -m pip install --quiet numpy pyyaml
            if ($LASTEXITCODE -ne 0) { throw "Failed to install numpy/pyyaml for CI checks" }
          }
          python -m py_compile scripts/tune-fusion.py
          if ($LASTEXITCODE -ne 0) { throw "py_compile failed" }
          @'
          import importlib.util, json, pathlib, tempfile, numpy as np
          spec = importlib.util.spec_from_file_location("tf", "scripts/tune-fusion.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              p = pathlib.Path(td) / "feedback.jsonl"
              p.write_text("\n".join([
                  json.dumps({"v": 2, "logits": [1.0, 2.0], "gram_deltas": [0.0, 0.1], "char_lps": [0.0, 0.0], "shown_top1_idx": 1, "chosen_idx": 1, "has_ctx": True}),
                  json.dumps({"cands": ["\u7532", "\u4e59"], "logits": [0.0, 1.0], "context": 123, "chosen_text": "\u4e59", "shown_top1": "\u4e59"}),
                  json.dumps({"v": 2, "logits": [1.0, 2.0], "chosen_idx": True, "shown_top1_idx": False}),
              ]) + "\n", encoding="utf-8")
              X, y, w, s = m.load_samples(p)
              assert len(X) == 2 and s["legacy_v1"] == 1, (len(X), s)
              conv, kept = m.scrub_legacy_log_files(p)
              assert conv == 1 and kept == 2, (conv, kept)
              assert "chosen_text" not in p.read_text(encoding="utf-8")
          assert not m.weights_pass_domain_sanity(np.array([1.0, 0.5, 0.0, 0.0, 0.0]))[0]
          assert m.weights_pass_domain_sanity(m.W_PRIOR)[0]
          print("tune-fusion self-test OK")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "tune-fusion self-test failed" }
          # 3. Validate example YAML files
          python -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('examples/*.custom.yaml')]; print('YAML examples OK')"
          if ($LASTEXITCODE -ne 0) { throw "YAML validation failed" }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release DLL (win-x64)
        run: cargo build --release --locked

      - name: Package release bundle & verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rime_neural.dll dist/rime_neural.dll
          Copy-Item lua/rime_neural.lua dist/rime_neural.lua
          Copy-Item LICENSE dist/LICENSE
          $hDll = (Get-FileHash dist/rime_neural.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $hLua = (Get-FileHash dist/rime_neural.lua -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $innerSums = "$hDll  rime_neural.dll`n$hLua  rime_neural.lua`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist).Path "SHA256SUMS.txt"), $innerSums, $utf8NoBom)
          $zipName = "rime-neural-$tag-win-x64.zip"
          Compress-Archive -Path dist/rime_neural.dll, dist/rime_neural.lua, dist/LICENSE, dist/SHA256SUMS.txt -DestinationPath "dist/$zipName" -Force
          $hZip = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $outerSums = "$innerSums$hZip  $zipName`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist).Path "SHA256SUMS.txt"), $outerSums, $utf8NoBom)
          # Self-verify generated SHA256SUMS.txt
          foreach ($entry in @(@("rime_neural.dll", $hDll), @("rime_neural.lua", $hLua), @($zipName, $hZip))) {
            $got = (Get-FileHash "dist/$($entry[0])" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $entry[1]) { throw "Self-verification failed for $($entry[0])" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rime-neural-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: rime-neural-win-x64
          path: dist

      - name: Publish GitHub Release on tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:TAG
          $zipItem = Get-ChildItem dist -Filter "rime-neural-*-win-x64.zip" | Select-Object -First 1
          if (-not $zipItem) { throw "Release zip artifact not found in dist/" }
          $zip = $zipItem.FullName
          $sums = "dist/SHA256SUMS.txt"
          if (-not (Test-Path $sums)) { throw "SHA256SUMS.txt missing from dist/" }
          $viewOut = & gh release view $tag 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sums --clobber
          } elseif ($viewOut -match 'release not found|404') {
            gh release create $tag $zip $sums --title "rime-neural $tag" --generate-notes
          } else {
            throw "gh release view failed unexpectedly: $viewOut"
          }
