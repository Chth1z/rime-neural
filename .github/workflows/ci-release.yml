name: CI & Windows x64 Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint-lua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Lua 5.4 syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua5.4
          luac5.4 -p lua/rime_neural.lua

  msrv-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust MSRV (1.92)
        uses: dtolnay/rust-toolchain@1.92

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV compatibility
        run: cargo check --locked --all-targets

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Validate tag matches Cargo.toml, Cargo.lock & CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $cargo = Get-Content Cargo.toml -Raw -Encoding UTF8
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Failed to parse version in Cargo.toml" }
          $cargoVer = $Matches[1]
          $expectedTag = "v$cargoVer"
          if ($env:TAG -ne $expectedTag) {
            throw "Git tag '$($env:TAG)' does not match Cargo.toml version '$expectedTag'"
          }
          $lock = Get-Content Cargo.lock -Raw -Encoding UTF8
          if ($lock -notmatch 'name = "rime_neural"\r?\nversion = "([^"]+)"') {
            throw "Failed to locate rime_neural version in Cargo.lock"
          }
          if ($Matches[1] -ne $cargoVer) {
            throw "Cargo.lock rime_neural version '$($Matches[1])' does not match Cargo.toml '$cargoVer'"
          }
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $escapedTag = [regex]::Escape($env:TAG)
          if ($changelog -notmatch "(?m)^## \[$escapedTag\]") {
            throw "CHANGELOG.md is missing a section header for '$($env:TAG)'"
          }

      - name: Validate PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($ps in @("scripts/install.ps1", "skills/rime-neural-setup/scripts/inspect-env.ps1", "skills/rime-neural-setup/scripts/verify-install.ps1")) {
            $full = (Resolve-Path $ps).Path
            $bytes = [System.IO.File]::ReadAllBytes($full)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "UTF-8 BOM detected in $ps"
            }
            foreach ($b in $bytes) {
              if ($b -gt 127) { throw "Non-ASCII byte detected in $ps" }
            }
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              throw "PowerShell 5.1 syntax error in ${ps}: $($errs | Out-String)"
            }
          }

      - name: Validate Python tuner & YAML files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "import numpy, yaml" 2>$null
          if ($LASTEXITCODE -ne 0) {
            python -m pip install --quiet numpy pyyaml
            if ($LASTEXITCODE -ne 0) { throw "Failed to install numpy/pyyaml for CI checks" }
          }
          python -m py_compile scripts/tune-fusion.py tests/test_tune_fusion.py
          if ($LASTEXITCODE -ne 0) { throw "py_compile failed" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Python unit tests failed" }
          python -c "import glob, yaml; files = glob.glob('examples/*.custom.yaml') + ['.github/workflows/ci-release.yml']; [yaml.safe_load(open(f, encoding='utf-8')) for f in files]; print(f'YAML OK ({len(files)} files)')"
          if ($LASTEXITCODE -ne 0) { throw "YAML validation failed" }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (strict)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release DLL (win-x64)
        run: cargo build --release --locked

      - name: Package release bundle & verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cargo = Get-Content Cargo.toml -Raw -Encoding UTF8
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Failed to parse Cargo.toml version" }
          $cargoVer = $Matches[1]
          $vi = (Get-Item target/release/rime_neural.dll).VersionInfo
          if ($vi.ProductVersion -ne $cargoVer) {
            throw "Embedded DLL ProductVersion '$($vi.ProductVersion)' does not match Cargo.toml '$cargoVer'"
          }
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rime_neural.dll dist/rime_neural.dll
          Copy-Item lua/rime_neural.lua dist/rime_neural.lua
          Copy-Item LICENSE dist/LICENSE
          $hDll = (Get-FileHash dist/rime_neural.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $hLua = (Get-FileHash dist/rime_neural.lua -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $innerSums = "$hDll  rime_neural.dll`n$hLua  rime_neural.lua`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist).Path "SHA256SUMS.txt"), $innerSums, $utf8NoBom)
          $zipName = "rime-neural-$tag-win-x64.zip"
          Compress-Archive -Path dist/rime_neural.dll, dist/rime_neural.lua, dist/LICENSE, dist/SHA256SUMS.txt -DestinationPath "dist/$zipName" -Force
          $hZip = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $outerSums = "$innerSums$hZip  $zipName`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist).Path "SHA256SUMS.txt"), $outerSums, $utf8NoBom)
          # Parse generated SHA256SUMS.txt using the exact installer regex and verify all entries
          $parsed = @{}
          foreach ($line in (Get-Content dist/SHA256SUMS.txt -Encoding UTF8)) {
            if ($line -match '^([0-9a-fA-F]{64})\s+\*?(.+?)\s*$') {
              $parsed[$Matches[2].Trim()] = $Matches[1].ToLowerInvariant()
            } elseif ($line.Trim()) {
              throw "Malformed SHA256SUMS.txt line: $line"
            }
          }
          foreach ($name in @("rime_neural.dll", "rime_neural.lua", $zipName)) {
            if (-not $parsed.ContainsKey($name)) { throw "Missing entry '$name' in SHA256SUMS.txt" }
            $got = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $parsed[$name]) { throw "SHA256SUMS.txt verification failed for $name" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rime-neural-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-x64, lint-lua, msrv-windows-x64]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: rime-neural-win-x64
          path: dist

      - name: Publish GitHub Release on tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:TAG
          $zipName = "rime-neural-$tag-win-x64.zip"
          $zip = Join-Path (Resolve-Path dist).Path $zipName
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Expected release zip artifact not found: $zip"
          }
          $sums = Join-Path (Resolve-Path dist).Path "SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $sums -PathType Leaf)) {
            throw "SHA256SUMS.txt missing from dist/"
          }
          $expectedZipHash = $null
          foreach ($line in (Get-Content -LiteralPath $sums -Encoding UTF8)) {
            if ($line -match '^([0-9a-fA-F]{64})\s+\*?(.+?)\s*$' -and $Matches[2].Trim() -eq $zipName) {
              $expectedZipHash = $Matches[1].ToLowerInvariant()
            }
          }
          if (-not $expectedZipHash) { throw "Missing '$zipName' hash in SHA256SUMS.txt" }
          $actualZipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZipHash -ne $expectedZipHash) {
            throw "Downloaded artifact hash mismatch for ${zipName}: expected $expectedZipHash, got $actualZipHash"
          }
          $viewOut = & gh release view $tag 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sums --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          } elseif ($viewOut -match 'release not found|404') {
            $createArgs = @("release", "create", $tag, $zip, $sums, "--title", "rime-neural $tag", "--generate-notes")
            if ($tag -match '-') { $createArgs += "--prerelease" }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          } else {
            throw "gh release view failed unexpectedly: $viewOut"
          }
