[package]
name = "rime_neural"
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/Chth1z/rime-neural"
repository = "https://github.com/Chth1z/rime-neural"
publish = false
description = "Zero-patch in-process ONNX neural sentence reranker for official Rime/Weasel (KV-cache, .gram mmap fusion, Pass-2 verified P2C, universal pinyin layouts, non-blocking UIA context, and unbiased MAP feedback tuning)"

[lib]
crate-type = ["cdylib"]

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
tokenizers = { version = "0.22.1", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
# Required so `catch_unwind` at every FFI entry point prevents panics from aborting `WeaselServer.exe`.
panic = "unwind"
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
