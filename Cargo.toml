[package]
name = "rime_neural"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Chth1z/rime-neural"
description = "Zero-patch in-process ONNX neural sentence reranker for official Rime/Weasel (KV-cache, .gram mmap fusion, Pass-2 verified P2C, universal pinyin layouts, non-blocking UIA context, and unbiased MAP feedback tuning)"

[lib]
crate-type = ["cdylib"]

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
tokenizers = { version = "0.22.1", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
